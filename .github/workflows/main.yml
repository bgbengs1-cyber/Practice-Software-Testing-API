
name: API Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman and reporters
        run: |
          npm install --no-save newman newman-reporter-html newman-reporter-htmlextra

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run API tests
        run: |
          npx newman run Toolshop-API.postman_collection.json \
            --reporters cli,html,htmlextra \
            --reporter-html-export reports/newman-report.html \
            --reporter-htmlextra-export reports/newman-htmlextra.html

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Test-Reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
