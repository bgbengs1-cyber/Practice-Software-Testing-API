
name: API Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install standard HTML reporter
        run: |
          npm install --prefix tools/html newman@4.6.1 newman-reporter-html@1.0.5

      - name: Install HTML Extra reporter
        run: |
          npm install --prefix tools/htmlextra newman@6.2.3 newman-reporter-htmlextra@1.23.1

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run standard HTML report
        run: |
          NODE_PATH=$GITHUB_WORKSPACE/tools/html/node_modules \
          node tools/html/node_modules/newman/bin/newman.js run Toolshop-API.postman_collection.json \
          --reporters cli,html \
          --reporter-html-export reports/newman-report.html

      - name: Run HTML Extra report
        run: |
          NODE_PATH=$GITHUB_WORKSPACE/tools/htmlextra/node_modules \
          node tools/htmlextra/node_modules/newman/bin/newman.js run Toolshop-API.postman_collection.json \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export reports/newman-htmlextra.html

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Test-Reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
